<div class="mb-6">
  <h2 class="text-2xl font-bold text-gray-800">Dashboard</h2>
  <p class="text-sm text-gray-500 mt-1">Overview of remittance verification activities</p>
</div>

<!-- Stats Cards -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
  <!-- Pending -->
  <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-6">
    <div class="flex items-center justify-between mb-2">
      <h3 class="text-sm font-medium text-gray-500">Pending Review</h3>
      <div class="p-2 bg-amber-50 rounded-lg">
        <i class="pi pi-clock text-amber-600 text-xl"></i>
      </div>
    </div>
    <p class="text-3xl font-bold text-gray-800">{{ stats().pending }}</p>
    <p class="text-xs text-gray-400 mt-1">Awaiting verification</p>
  </div>

  <!-- Approved -->
  <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-6">
    <div class="flex items-center justify-between mb-2">
      <h3 class="text-sm font-medium text-gray-500">Approved</h3>
      <div class="p-2 bg-green-50 rounded-lg">
        <i class="pi pi-check-circle text-green-600 text-xl"></i>
      </div>
    </div>
    <p class="text-3xl font-bold text-gray-800">{{ stats().approved }}</p>
    <p class="text-xs text-gray-400 mt-1">Verified remittances</p>
  </div>

  <!-- Rejected -->
  <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-6">
    <div class="flex items-center justify-between mb-2">
      <h3 class="text-sm font-medium text-gray-500">Rejected</h3>
      <div class="p-2 bg-red-50 rounded-lg">
        <i class="pi pi-times-circle text-red-600 text-xl"></i>
      </div>
    </div>
    <p class="text-3xl font-bold text-gray-800">{{ stats().rejected }}</p>
    <p class="text-xs text-gray-400 mt-1">Requires correction</p>
  </div>

  <!-- Total -->
  <div class="bg-white rounded-lg shadow-sm border border-gray-100 p-6">
    <div class="flex items-center justify-between mb-2">
      <h3 class="text-sm font-medium text-gray-500">Total Remittances</h3>
      <div class="p-2 bg-blue-50 rounded-lg">
        <i class="pi pi-file text-blue-600 text-xl"></i>
      </div>
    </div>
    <p class="text-3xl font-bold text-gray-800">{{ stats().total }}</p>
    <p class="text-xs text-gray-400 mt-1">All time</p>
  </div>
</div>
